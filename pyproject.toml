[project]
name = "healthcare-facility-finder"
version = "0.3.0"
description = "Find hospitals, clinics and labs across India in plain English or Hindi."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Anup Kumar Subba", email = "anupsubba007@gmail.com" }]
dependencies = [
    "pandas",
    "requests",
    "rapidfuzz",
    "geopy",
    "sqlalchemy",
    "psycopg[binary]",
    "fastapi",
    "uvicorn",
    "slowapi",
    "langgraph",
    "langchain-core",
    "langchain-community",
    "langchain-groq",
    "langchain-google-genai",
    "langchain-chroma",
    "fastembed",
    "pydantic",
    "python-dotenv",
    "langsmith",
    "mcp>=2",
]

[dependency-groups]
dev = ["pytest", "ruff", "pre-commit", "httpx", "streamlit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/facility_finder"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/facility_finder/agent/prompts.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["db: needs a PostgreSQL + PostGIS database (DATABASE_URL)"]
