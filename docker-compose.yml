# Local PostgreSQL + PostGIS for development and tests:  docker compose up -d db
services:
  db:
    image: postgis/postgis:16-3.4   #pick a current tag if this one has moved on
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: facilities
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
